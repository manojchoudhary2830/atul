<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PERIMETER — GPS Territory Game · UI/UX System</title>
<meta name="description" content="Design system and clickable prototype for a GPS-based multiplayer territory game.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PERIMETER — design tokens
   ============================================================ */
:root{
  /* page chrome (adapts to viewer theme) */
  --page-bg:#EFF1F2; --page-card:#FFFFFF; --page-fg:#0C1014;
  --page-muted:#5A666E; --page-line:#DCE1E4; --page-line-2:#C6CED3;

  /* ---- product tokens (always dark: this is a dark-first product) ---- */
  --void:#06080A;
  --surface:#0D1116;
  --surface-2:#131A20;
  --surface-3:#1C252D;
  --surface-4:#26323B;
  --line:#212C34;
  --line-2:#32424D;

  --primary:#B9FF3C;
  --primary-dim:#8FCC22;
  --primary-ink:#0A1400;
  --primary-wash:rgba(185,255,60,.12);

  --secondary:#3BE0FF;
  --success:#3DD68C;
  --warning:#FFC048;
  --danger:#FF5A5A;

  --text:#F1F5F4;
  --text-2:#9FADB6;
  --text-3:#84929B;

  /* ---- territory palette: deliberately disjoint from UI accents ---- */
  --t-you:#2DE1FF;
  --t-rose:#FF3D77;
  --t-amber:#FFB01F;
  --t-violet:#A16BFF;
  --t-ember:#FF6A3D;
  --t-neutral:#6B7785;
  --t-route:#B9FF3C;

  /* map substrate */
  --map-bg:#080C10;
  --map-block:#10171D;
  --map-block-2:#141D24;
  --map-road:#1B262E;
  --map-road-hi:#27353F;
  --map-water:#0B1C28;
  --map-park:#0D1A14;

  /* spacing — 8px system */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --s7:40px; --s8:48px; --s9:64px;

  /* radius */
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-full:999px;

  /* elevation */
  --e1:0 1px 2px rgba(0,0,0,.4);
  --e2:0 4px 16px rgba(0,0,0,.45);
  --e3:0 12px 40px rgba(0,0,0,.55);
  --e-sheet:0 -12px 48px rgba(0,0,0,.6);
  --glow:0 0 0 1px rgba(185,255,60,.35), 0 8px 28px rgba(185,255,60,.18);

  /* motion */
  --d-micro:180ms; --d-ui:320ms; --d-major:760ms;
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);

  /* type */
  --font-display:"Archivo","Archivo Expanded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page-bg:#070A0C; --page-card:#0F1418; --page-fg:#EDF1F3;
    --page-muted:#8C99A2; --page-line:#1C242A; --page-line-2:#2A343B;
  }
}
:root[data-theme="dark"]{
  --page-bg:#070A0C; --page-card:#0F1418; --page-fg:#EDF1F3;
  --page-muted:#8C99A2; --page-line:#1C242A; --page-line-2:#2A343B;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page-bg); color:var(--page-fg);
  font-family:var(--font-ui); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh;
}
img{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--primary); outline-offset:2px; border-radius:4px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* number rendering: expanded + tabular is the product's signature */
.num{font-family:var(--font-display); font-variation-settings:"wdth" 112,"wght" 700;
  font-feature-settings:"tnum" 1,"zero" 1; letter-spacing:-.02em; line-height:1}

/* ============================================================
   PAGE SHELL
   ============================================================ */
.shell{max-width:1560px;margin:0 auto;padding:0 clamp(12px,3vw,32px) 64px}

.topbar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;
  padding:14px 0; margin-bottom:var(--s5);
  background:color-mix(in srgb,var(--page-bg) 88%,transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--page-line);
}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{display:block}
.brand b{font-family:var(--font-display);font-variation-settings:"wdth" 118,"wght" 800;
  font-size:17px;letter-spacing:.14em;text-transform:uppercase}
.brand span{color:var(--page-muted);font-size:12.5px;display:block;letter-spacing:.01em}

.seg{display:flex;gap:2px;padding:3px;border:1px solid var(--page-line);
  background:var(--page-card);border-radius:var(--r-full)}
.seg button{padding:7px 15px;border-radius:var(--r-full);font-size:13px;font-weight:500;
  color:var(--page-muted);transition:background var(--d-micro) var(--ease),color var(--d-micro)}
.seg button[aria-selected="true"]{background:var(--page-fg);color:var(--page-bg);font-weight:600}
.seg button:hover:not([aria-selected="true"]){color:var(--page-fg)}

.tog{display:flex;gap:6px;flex-wrap:wrap}
.tog button{display:flex;align-items:center;gap:7px;padding:7px 12px;font-size:12.5px;
  border:1px solid var(--page-line);background:var(--page-card);border-radius:var(--r-full);
  color:var(--page-muted);transition:border-color var(--d-micro),color var(--d-micro)}
.tog button[aria-pressed="true"]{color:var(--page-fg);border-color:var(--page-line-2)}
.tog i{width:9px;height:9px;border-radius:50%;background:var(--page-line-2);transition:background var(--d-micro)}
.tog button[aria-pressed="true"] i{background:var(--primary-dim)}

/* workspace */
.work{display:grid;grid-template-columns:238px minmax(0,1fr);gap:clamp(16px,2.4vw,36px);align-items:start}
.work.wide{grid-template-columns:minmax(0,1fr)}

.nav-h{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--page-muted);
  font-weight:600;margin:20px 0 7px;padding-left:10px}
.nav-h:first-child{margin-top:0}
.navlist{display:flex;flex-direction:column;gap:1px;list-style:none;margin:0;padding:0}
.navlist button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:8px 10px;border-radius:9px;font-size:13.5px;color:var(--page-muted);
  transition:background var(--d-micro),color var(--d-micro)}
.navlist button:hover{background:color-mix(in srgb,var(--page-fg) 6%,transparent);color:var(--page-fg)}
.navlist button[aria-current="true"]{background:var(--page-fg);color:var(--page-bg);font-weight:600}
.navlist .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.4;flex:none}
.navlist button[aria-current="true"] .dot{opacity:1;background:var(--primary-dim)}

.side{position:sticky;top:86px;max-height:calc(100vh - 110px);overflow-y:auto;
  padding-right:6px;scrollbar-width:thin}

/* stage */
.stage{display:flex;flex-direction:column;align-items:center;gap:var(--s4);min-height:60vh}
.stage-head{width:100%;display:flex;align-items:flex-end;gap:var(--s4);flex-wrap:wrap;
  padding-bottom:var(--s3);border-bottom:1px solid var(--page-line)}
.stage-head h2{margin:0;font-family:var(--font-display);font-variation-settings:"wdth" 112,"wght" 700;
  font-size:clamp(20px,2.4vw,26px);letter-spacing:-.015em;line-height:1.1}
.stage-head p{margin:4px 0 0;color:var(--page-muted);font-size:13.5px;max-width:62ch}
.stage-head .spacer{margin-left:auto}
.stepper{display:flex;gap:6px;align-items:center}
.stepper button{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;
  border:1px solid var(--page-line);background:var(--page-card);color:var(--page-muted)}
.stepper button:hover{color:var(--page-fg);border-color:var(--page-line-2)}
.stepper span{font-size:12.5px;color:var(--page-muted);min-width:56px;text-align:center}

/* ============================================================
   DEVICE FRAMES
   ============================================================ */
.devwrap{display:flex;justify-content:center;width:100%}
.device{
  position:relative;width:390px;height:844px;flex:none;
  border-radius:44px;background:#000;padding:11px;
  box-shadow:0 0 0 1.5px #2b343a, 0 40px 90px rgba(0,0,0,.45), 0 2px 0 rgba(255,255,255,.05) inset;
  transform-origin:top center;
}
.device::after{content:"";position:absolute;left:50%;transform:translateX(-50%);
  top:11px;width:112px;height:28px;border-radius:0 0 18px 18px;background:#000;z-index:8;pointer-events:none}
.screen{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;
  background:var(--void);color:var(--text);display:flex;flex-direction:column;isolation:isolate}
.statusbar{position:absolute;inset:0 0 auto 0;height:44px;z-index:7;display:flex;align-items:center;
  justify-content:space-between;padding:0 26px;font-size:12.5px;font-weight:600;color:var(--text);
  pointer-events:none}
.statusbar .sb-r{display:flex;gap:5px;align-items:center;opacity:.9}
.homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:134px;height:5px;
  border-radius:3px;background:rgba(255,255,255,.35);z-index:9;pointer-events:none}

.browser{width:1440px;height:900px;flex:none;border-radius:14px;overflow:hidden;background:var(--void);
  box-shadow:0 0 0 1px #2b343a,0 40px 90px rgba(0,0,0,.4);transform-origin:top left}
.bchrome{height:40px;background:#121A20;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:8px;padding:0 14px}
.bchrome i{width:11px;height:11px;border-radius:50%;background:#33414C;display:block}
.burl{margin-left:12px;flex:1;max-width:460px;height:24px;border-radius:var(--r-full);background:#0A0F13;
  border:1px solid var(--line);display:flex;align-items:center;padding:0 12px;font-size:11.5px;color:var(--text-3)}
.bbody{height:860px;display:flex;overflow:hidden}

/* ============================================================
   PRODUCT UI PRIMITIVES
   ============================================================ */
.app{font-family:var(--font-ui);color:var(--text)}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 20px}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.gap2{gap:8px}.gap3{gap:12px}.gap4{gap:16px}
.grow{flex:1}

/* type scale */
.t-display{font-family:var(--font-display);font-variation-settings:"wdth" 118,"wght" 800;
  font-size:40px;line-height:1.02;letter-spacing:-.03em}
.t-h1{font-family:var(--font-display);font-variation-settings:"wdth" 110,"wght" 700;
  font-size:26px;line-height:1.14;letter-spacing:-.02em}
.t-h2{font-family:var(--font-display);font-variation-settings:"wdth" 106,"wght" 700;
  font-size:19px;line-height:1.2;letter-spacing:-.01em}
.t-h3{font-family:var(--font-display);font-variation-settings:"wdth" 104,"wght" 600;
  font-size:15.5px;line-height:1.3}
.t-body{font-size:14.5px;line-height:1.5}
.t-small{font-size:13px;line-height:1.5;color:var(--text-2)}
.t-cap{font-size:11.5px;line-height:1.4;color:var(--text-3)}
.t-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--text-3)}
.t-metric{font-family:var(--font-display);font-variation-settings:"wdth" 120,"wght" 700;
  font-feature-settings:"tnum" 1;font-size:30px;line-height:1;letter-spacing:-.025em}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  height:50px;padding:0 22px;border-radius:var(--r-md);font-size:15px;font-weight:600;
  transition:transform var(--d-micro) var(--ease),background var(--d-micro),box-shadow var(--d-micro),opacity var(--d-micro);
  white-space:nowrap;position:relative}
.btn:active{transform:scale(.975)}
.btn-primary{background:var(--primary);color:var(--primary-ink);box-shadow:0 6px 22px rgba(185,255,60,.18)}
.btn-primary:hover{background:#C7FF5E}
.btn-secondary{background:var(--surface-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn-secondary:hover{background:var(--surface-4)}
.btn-ghost{color:var(--text-2)}
.btn-ghost:hover{color:var(--text);background:rgba(255,255,255,.05)}
.btn-danger{background:rgba(255,90,90,.14);color:#FF8A8A;box-shadow:inset 0 0 0 1px rgba(255,90,90,.3)}
.btn-danger:hover{background:rgba(255,90,90,.2)}
.btn-block{width:100%}
.btn-sm{height:38px;padding:0 15px;font-size:13.5px;border-radius:var(--r-sm)}
.btn-lg{height:58px;font-size:16px;border-radius:var(--r-lg)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.38;pointer-events:none;box-shadow:none}
.btn-loading{color:transparent!important}
.btn-loading::after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;
  border:2px solid rgba(10,20,0,.28);border-top-color:var(--primary-ink);animation:spin .7s linear infinite}
.btn-secondary.btn-loading::after{border-color:rgba(255,255,255,.2);border-top-color:var(--text)}
@keyframes spin{to{transform:rotate(360deg)}}

.iconbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:var(--r-sm);
  background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);color:var(--text-2);
  transition:color var(--d-micro),background var(--d-micro)}
.iconbtn:hover{color:var(--text);background:var(--surface-3)}
.iconbtn.round{border-radius:50%}

/* cards */
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4)}
.card-flat{background:var(--surface);border:1px solid var(--line)}
.card-press{transition:transform var(--d-micro) var(--ease),border-color var(--d-micro);cursor:pointer;text-align:left;width:100%}
.card-press:hover{border-color:var(--line-2)}
.card-press:active{transform:scale(.985)}

/* chips + status */
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-full);
  font-size:11.5px;font-weight:600;letter-spacing:.02em;background:var(--surface-3);color:var(--text-2)}
.chip .bead{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.chip-live{background:rgba(255,90,90,.15);color:#FF7A7A}
.chip-live .bead{background:#FF5A5A;animation:pulse 1.6s var(--ease) infinite}
.chip-rec{background:rgba(185,255,60,.14);color:var(--primary)}
.chip-cap{background:rgba(255,176,31,.14);color:var(--t-amber)}
.chip-attack{background:rgba(255,61,119,.15);color:var(--t-rose)}
.chip-prot{background:rgba(61,214,140,.14);color:var(--success)}
.chip-off{background:var(--surface-3);color:var(--text-3)}
.chip-sync{background:rgba(59,224,255,.13);color:var(--secondary)}
.chip-you{background:rgba(45,225,255,.14);color:var(--t-you)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:var(--r-full);
  background:var(--danger);color:#fff;font-size:10.5px;font-weight:700}

.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-family:var(--font-display);font-variation-settings:"wdth" 108,"wght" 700;font-size:14px;
  color:#07090B;letter-spacing:.02em}
.avatar.sm{width:30px;height:30px;font-size:11.5px}
.avatar.lg{width:72px;height:72px;font-size:24px}
.avatar.ring{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--t-you)}

/* progress */
.bar{height:8px;border-radius:var(--r-full);background:var(--surface-4);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:var(--r-full);background:var(--primary);
  transition:width var(--d-ui) var(--ease);position:relative}
.bar.amber>i{background:var(--t-amber)}
.bar.rose>i{background:var(--t-rose)}
.bar.you>i{background:var(--t-you)}
.bar-seg{display:flex;gap:3px;height:9px}
.bar-seg i{flex:1;border-radius:2px;background:var(--surface-4);transition:background var(--d-micro)}
.bar-seg i.on{background:var(--t-amber)}
.ring-wrap{position:relative;display:grid;place-items:center}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-wrap .ring-val{position:absolute;text-align:center}

/* form */
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12.5px;color:var(--text-2);font-weight:500}
.input{height:50px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line);
  padding:0 14px;color:var(--text);font-size:15px;font-family:inherit;width:100%;
  transition:border-color var(--d-micro),background var(--d-micro)}
.input::placeholder{color:var(--text-3)}
.input:focus{outline:none;border-color:var(--primary);background:var(--surface-3)}
.switch{width:46px;height:28px;border-radius:var(--r-full);background:var(--surface-4);position:relative;
  flex:none;transition:background var(--d-micro) var(--ease)}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#7C8A94;
  transition:transform var(--d-micro) var(--ease),background var(--d-micro)}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"] i{transform:translateX(18px);background:var(--primary-ink)}
.radio{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line-2);flex:none;
  display:grid;place-items:center;transition:box-shadow var(--d-micro)}
.radio[aria-checked="true"]{box-shadow:inset 0 0 0 7px var(--primary)}

/* list rows */
.rowitem{display:flex;align-items:center;gap:12px;padding:13px 0;width:100%;text-align:left;
  border-bottom:1px solid var(--line)}
.rowitem:last-child{border-bottom:0}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:8px 14px;border-radius:var(--r-full);font-size:13px;font-weight:500;color:var(--text-3);
  white-space:nowrap;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);
  transition:color var(--d-micro),background var(--d-micro)}
.tabs button[aria-selected="true"]{background:var(--text);color:var(--void);font-weight:600;box-shadow:none}
.tabs button:hover:not([aria-selected="true"]){color:var(--text-2)}

/* skeletons */
.sk{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);
  background-size:400% 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:var(--r-sm)}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* bottom nav */
.bnav{position:relative;z-index:6;height:76px;flex:none;margin-top:auto;display:grid;grid-template-columns:repeat(5,1fr);
  align-items:center;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:14px}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:600;
  color:var(--text-3);letter-spacing:.02em;transition:color var(--d-micro)}
.bnav button[aria-current="true"]{color:var(--primary)}
.bnav button:hover{color:var(--text-2)}
.bnav .fab{width:56px;height:56px;border-radius:19px;background:var(--primary);color:var(--primary-ink);
  display:grid;place-items:center;margin-top:-20px;box-shadow:0 8px 26px rgba(185,255,60,.3);
  transition:transform var(--d-micro) var(--ease)}
.bnav .fab:hover{transform:translateY(-2px)}
.bnav .fab:active{transform:scale(.94)}

/* ============================================================
   MAP
   ============================================================ */
.map{position:absolute;inset:0;background:var(--map-bg);overflow:hidden}
.map svg{width:100%;height:100%;display:block}
.terr{transition:fill-opacity var(--d-ui) var(--ease),stroke-opacity var(--d-ui)}
.terr-fill{fill-opacity:.17}
.terr-stroke{fill:none;stroke-width:2;stroke-linejoin:round}
.terr-dim .terr-fill{fill-opacity:.07}
.terr-dim .terr-stroke{stroke-opacity:.35}
.terr-hot .terr-fill{fill-opacity:.3}
.terr-attack .terr-stroke{stroke-dasharray:7 5;animation:march 1.1s linear infinite}
@keyframes march{to{stroke-dashoffset:-24}}
.terr-label{font-family:var(--font-display);font-variation-settings:"wdth" 108,"wght" 700;
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.terr-sub{font-family:var(--font-display);font-variation-settings:"wdth" 112,"wght" 600;
  font-size:9.5px;fill:rgba(255,255,255,.55);letter-spacing:.02em}

/* ---------- deterministic city substrate ---------- */
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const CITY = (()=>{
  const r = rng(20260918), blocks=[], roads=[];
  for(let i=0;i<=17;i++){
    const x=i*75+6; roads.push(`M${x} -40 L${x+ (r()*22-11)} 1240`);
    const y=i*75+10; roads.push(`M-40 ${y} L1240 ${y+(r()*22-11)}`);
  }
  for(let gx=0;gx<17;gx++) for(let gy=0;gy<17;gy++){
    const n = 1+Math.floor(r()*3);
    for(let k=0;k<n;k++){
      const w=16+r()*30, h=14+r()*28;
      const x=gx*75+12+r()*(52-w), y=gy*75+16+r()*(50-h);
      blocks.push({x:+x.toFixed(1),y:+y.toFixed(1),w:+w.toFixed(1),h:+h.toFixed(1),t:r()>.72?1:0});
    }
  }
  return {blocks,roads};
})();

/* ---------- geometry helpers ---------- */
function ptsAttr(a){return a.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}
function centroid(a){let x=0,y=0;a.forEach(p=>{x+=p[0];y+=p[1]});return[x/a.length,y/a.length]}
const RLEN=(()=>{let tot=0,cum=[0];for(let i=1;i<ROUTE.length;i++){tot+=Math.hypot(ROUTE[i][0]-ROUTE[i-1][0],ROUTE[i][1]-ROUTE[i-1][1]);cum.push(tot)}return{tot,cum}})();
function routeUpTo(t){
  const target=RLEN.tot*Math.max(0,Math.min(1,t)), out=[ROUTE[0]];
  for(let i=1;i<ROUTE.length;i++){
    if(RLEN.cum[i]<=target){out.push(ROUTE[i]);continue}
    const seg=RLEN.cum[i]-RLEN.cum[i-1], f=seg?(target-RLEN.cum[i-1])/seg:0;
    out.push([ROUTE[i-1][0]+(ROUTE[i][0]-ROUTE[i-1][0])*f, ROUTE[i-1][1]+(ROUTE[i][1]-ROUTE[i-1][1])*f]);
    break;
  }
  return out;
}
function routePos(t){const p=routeUpTo(t);return p[p.length-1]}
function capProgress(t){return Math.max(0,Math.min(1,(t-CAP_T[0])/(CAP_T[1]-CAP_T[0])))}

/* ---------- map renderer ---------- */
let MAPID=0;
const VIEWS = {
  city:[60,150,1080,1080], home:[150,520,520,520], close:[400,300,520,520],
  run:[230,330,700,700], mid:[470,260,420,420], own:[140,540,400,400],
  signal:[830,170,320,320], wide:[0,60,1200,1120]
};
function mapSVG(o){
  o=o||{}; const id="m"+(++MAPID), v=o.view||VIEWS.city;
  const px=o.px||366, u=v[2]/px;               /* world units per displayed CSS pixel */
  const showT = o.terr===undefined? TERR.map(t=>t.id) : o.terr;
  const labels = o.labels!==false, dim = o.dim||[];
  const fs=(11*u).toFixed(1), fs2=(9.2*u).toFixed(1), pu=(7*u).toFixed(2);
  const NS='vector-effect="non-scaling-stroke"';
  let s=`<svg viewBox="${v.join(' ')}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${o.alt||'Map of nearby territories'}">`;
  s+=`<defs>`;
  ["0","45","90","135","dot","cross"].forEach((a,i)=>{
    const ang = (a==="dot"||a==="cross")?0:a;
    s+=`<pattern id="${id}p${i}" width="${pu}" height="${pu}" patternUnits="userSpaceOnUse" patternTransform="rotate(${ang})">`;
    if(a==="dot") s+=`<circle cx="${pu/2}" cy="${pu/2}" r="${(1.5*u).toFixed(2)}" fill="#fff"/>`;
    else if(a==="cross") s+=`<path d="M0 0H${pu}M0 0V${pu}" stroke="#fff" stroke-width="1.4" ${NS}/>`;
    else s+=`<path d="M0 0V${pu}" stroke="#fff" stroke-width="2" ${NS}/>`;
    s+=`</pattern>`;
  });
  s+=`<clipPath id="${id}c"><rect x="${v[0]}" y="${v[1]}" width="${v[2]}" height="${v[3]}"/></clipPath></defs>`;
  s+=`<g clip-path="url(#${id}c)">`;
  s+=`<rect x="${v[0]-20}" y="${v[1]-20}" width="${v[2]+40}" height="${v[3]+40}" fill="var(--map-bg)"/>`;
  s+=`<path d="${RIVER}" stroke="var(--map-water)" stroke-width="54" fill="none" stroke-linecap="round"/>`;
  PARKS.forEach(p=>{s+=`<polygon points="${ptsAttr(p)}" fill="var(--map-park)"/>`});
  CITY.blocks.forEach(b=>{
    if(b.x+b.w<v[0]-30||b.x>v[0]+v[2]+30||b.y+b.h<v[1]-30||b.y>v[1]+v[3]+30) return;
    s+=`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="1.6" fill="${b.t?'var(--map-block-2)':'var(--map-block)'}"/>`;
  });
  s+=`<g stroke="var(--map-road)" stroke-width="1" fill="none" ${NS}>`;
  CITY.roads.forEach(d=>{s+=`<path d="${d}"/>`}); s+=`</g>`;
  s+=`<g stroke="var(--map-road-hi)" stroke-width="2.6" fill="none" stroke-linecap="round" ${NS}>`;
  ARTERIALS.forEach(d=>{s+=`<path d="${d}"/>`}); s+=`</g>`;
  TERR.forEach(t=>{
    if(showT.indexOf(t.id)<0) return;
    const hue=(o.recolor&&o.recolor[t.id])?HUES[o.recolor[t.id]]:HUES[t.hue], cls=["terr"];
    if(dim.indexOf(t.id)>=0) cls.push("terr-dim");
    if(o.hot===t.id) cls.push("terr-hot");
    if(t.state==="attacked"||o.attack===t.id) cls.push("terr-attack");
    s+=`<g class="${cls.join(' ')}">`;
    s+=`<polygon class="terr-fill" points="${ptsAttr(t.pts)}" style="fill:${hue}"/>`;
    s+=`<polygon class="terr-pattern" points="${ptsAttr(t.pts)}" fill="url(#${id}p${t.pat})" opacity=".4"/>`;
    s+=`<polygon class="terr-stroke" points="${ptsAttr(t.pts)}" style="stroke:${hue}" ${NS}/>`;
    if(labels && (t.area>4 || v[2]<600)){
      const c=centroid(t.pts);
      s+=`<text class="terr-label" x="${c[0].toFixed(0)}" y="${(c[1]-2).toFixed(0)}" text-anchor="middle" style="fill:${hue};font-size:${fs}px">${t.name.toUpperCase()}</text>`;
      s+=`<text class="terr-sub" x="${c[0].toFixed(0)}" y="${(+c[1]+ +fs+3*u).toFixed(0)}" text-anchor="middle" style="font-size:${fs2}px">${t.area.toFixed(2)} km²</text>`;
    }
    s+=`</g>`;
  });
  if(o.ping){const c=centroid(T(o.ping).pts);
    s+=`<circle class="capture-ping" cx="${c[0].toFixed(0)}" cy="${c[1].toFixed(0)}" r="1" ${NS} style="--s0:${(14*u).toFixed(1)};--s1:${(48*u).toFixed(1)}"/>`}
  if(o.ghost) s+=`<path class="route-ghost" d="M${ptsAttr(ROUTE).replace(/ /g,' L')}" ${NS}/>`;
  if(o.route!==undefined && o.route!==null){
    const pts=routeUpTo(o.route);
    if(o.preview && pts.length>3)
      s+=`<polygon class="route-prev" points="${ptsAttr(pts)}" fill="var(--t-you)" fill-opacity=".14" stroke="var(--t-you)" stroke-width="1.4" stroke-dasharray="5 4" ${NS}/>`;
    s+=`<path class="route" d="M${ptsAttr(pts).replace(/ /g,' L')}" ${NS}/>`;
  }
  if(o.players){
    NEARBY.forEach(p=>{
      s+=`<g><circle cx="${p.x}" cy="${p.y}" r="${(8*u).toFixed(1)}" fill="var(--surface)" stroke="${HUES[p.hue]}" stroke-width="1.8" ${NS}/>`;
      s+=`<circle cx="${p.x}" cy="${p.y}" r="${(3.2*u).toFixed(1)}" fill="${HUES[p.hue]}"/></g>`;
    });
  }
  if(o.me!==false){
    const m = (o.route!==undefined&&o.route!==null) ? routePos(o.route) : (o.mePos||[330,742]);
    const r0=8*u;
    s+=`<g class="me-marker" transform="translate(${m[0].toFixed(1)},${m[1].toFixed(1)})">`+
       `<circle class="me-halo" r="${(r0*2.2).toFixed(1)}"/>`+
       `<circle r="${r0.toFixed(1)}" fill="#07090B" stroke="var(--t-you)" stroke-width="2.4" ${NS}/>`+
       `<circle r="${(r0*.44).toFixed(1)}" fill="var(--t-you)"/></g>`;
  }
  s+=`</g></svg>`;
  return s;
}

function fitView(pts){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  pts.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])});
  const w=Math.max(x1-x0,y1-y0)*1.5, cx=(x0+x1)/2, cy=(y0+y1)/2;
  return [cx-w/2,cy-w/2,w,w];
}

function fmtTime(s){const m=Math.floor(s/60),ss=Math.floor(s%60);return `${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`}

  return {km:km.toFixed(2), time:fmtTime(sec), pace:t>0.01?`${pm}:${String(ps).padStart(2,"0")}`:"—:—", area:(3.42*t).toFixed(2)};
}

/* ---------- territory management ---------- */
const TTABS=["All","Active","Protected","Under attack"];
M.territories = ()=>{
  const list=TERR.filter(t=>t.owner==="you");
  const filtered = S.terrTab==="Under attack" ? list.filter(t=>t.state==="attacked")
    : S.terrTab==="Protected" ? [] : list;
  return `<div class="screen app">${statusbar()}
  ${topbar("My territories",{right:`<button class="iconbtn round" aria-label="Sort">${ic("chart",19)}</button>`})}
  <div class="pad" style="padding-bottom:14px"><div class="tabs">
    ${TTABS.map(t=>`<button data-act="terrtab:${t}" aria-selected="${S.terrTab===t}">${t}</button>`).join("")}
  </div></div>
  <div class="scroll pad" style="padding-bottom:26px">
    ${filtered.length===0?`<div class="empty">
      <svg class="art" viewBox="0 0 120 120" fill="none" aria-hidden="true">
        <polygon points="60,18 98,42 86,94 34,94 22,42" stroke="var(--line-2)" stroke-width="2" stroke-dasharray="6 6" stroke-linejoin="round"/>
        <path d="M44 62h32M60 46v32" stroke="var(--line-2)" stroke-width="2" stroke-linecap="round"/></svg>
      <div><div class="t-h2" style="margin-bottom:6px">Nothing protected yet</div>
        <p class="t-small" style="margin:0;max-width:30ch">Hold a territory for seven days without losing it and it becomes protected.</p></div>
      <button class="btn btn-secondary" data-act="terrtab:All">Show all territories</button></div>`:
    `<div class="stack" style="gap:12px">${filtered.map(t=>`
      <button class="card card-press" data-act="sheet-go:${t.id}" style="padding:12px">
        <div class="row gap3">
          <div class="minimap" style="width:82px;height:82px;flex:none;border-radius:var(--r-sm)">
            ${mapSVG({view:fitView(t.pts),terr:[t.id],labels:false,me:false,players:false})}</div>
          <div class="grow stack" style="gap:6px">
            <div class="row"><div class="t-h3 grow">${t.name}</div>${ic("chevR",18)}</div>
            <div class="hero-metric"><span class="num" style="font-size:21px">${t.area.toFixed(2)}</span><span class="u" style="font-size:12px">km²</span></div>
            <div class="row gap2">${stateChip(t.state)}
              ${t.week!=="new"?`<span class="delta ${t.week[0]==="-"?"down":""}">${t.week} this week</span>`:""}</div>
          </div></div></button>`).join("")}
      <div class="card card-flat row gap3" style="border-style:dashed">
        <span style="color:var(--text-3)">${ic("info",18)}</span>
        <div class="t-small grow">Territories shrink by 2% a week if you don't move through them.</div></div>
    </div>`}
  </div>${bnav("")}${homebar()}</div>`;
};

/* ---------- leaderboard ---------- */
M.leaderboard = ()=>{
  const scopes=["Nearby","City","Country","Global"], times=["Daily","Weekly","Monthly","Season","All time"],
    cats=["Territory","Distance","Captures","Activities"];
  const val=p=>S.lbCat==="Distance"?[p.dist.toFixed(0),"km"]:S.lbCat==="Captures"?[p.caps,""]:S.lbCat==="Activities"?[(p.caps*2+6),""]:[p.area.toFixed(1),"km²"];
  const sorted=[...LEADERS].sort((a,b)=>+val(b)[0]-+val(a)[0]);
  return `<div class="screen app">${statusbar()}
  ${topbar("Leaderboard",{right:`<button class="iconbtn round" aria-label="Search players">${ic("search",19)}</button>`})}
  <div class="pad stack" style="gap:8px;padding-bottom:12px">
    <div class="tabs">${scopes.map(s=>`<button data-act="lb:scope:${s}" aria-selected="${S.lbScope===s}">${s}</button>`).join("")}</div>
    <div class="tabs">${cats.map(s=>`<button data-act="lb:cat:${s}" aria-selected="${S.lbCat===s}">${s}</button>`).join("")}</div>
  </div>
  <div class="scroll pad" style="padding-bottom:26px">
    <div class="row gap2" style="margin-bottom:12px">
      ${times.map(t=>`<button class="btn btn-ghost btn-sm" data-act="lb:time:${t}" style="padding:0 8px;height:28px;${S.lbTime===t?"color:var(--primary)":""}">${t}</button>`).join("")}
    </div>
    <div class="stack" style="gap:2px">
      ${sorted.map((p,i)=>{const [v,u]=val(p);return `
      <button class="lb-row ${p.me?"me":""}" data-go="${p.me?"profile":"player"}" style="width:100%;text-align:left">
        <span class="rank ${i<3?"top":""}">${i+1}</span>
        ${av(p.i,p.hue,"sm")}
        <div class="grow" style="min-width:0"><div class="t-body" style="font-weight:600">${p.n}${p.me?' <span class="t-cap">· you</span>':""}</div>
          <div class="t-cap">${p.h}</div></div>
        <div class="stack" style="align-items:flex-end;gap:1px">
          <span class="num" style="font-size:16px">${v}</span><span class="t-cap">${u||S.lbCat.toLowerCase()}</span></div>
      </button>`}).join("")}
    </div>
    <p class="t-cap" style="text-align:center;margin-top:18px">Ranked among ${S.lbScope==="Nearby"?"players within 10 km":"players in your "+S.lbScope.toLowerCase()} · updated hourly</p>
  </div>${bnav("leaderboard")}${homebar()}</div>`;
};

  <div class="stack" style="gap:12px"><span class="t-label">Territory capture</span>
    <button class="btn btn-secondary btn-sm" data-act="demo-capture" style="align-self:flex-start">Play the ownership change</button>
    <div class="minimap" style="height:124px" id="capdemo">${mapSVG({view:fitView(T("midtown").pts),terr:["midtown"],labels:false,me:false,players:false})}</div></div>
  <div class="stack" style="gap:12px"><span class="t-label">Capture progress</span>
    <button class="btn btn-secondary btn-sm" data-act="demo-bar" style="align-self:flex-start">Advance progress</button>
    <div class="bar amber"><i id="demobar" style="width:12%"></i></div>
    <span class="t-cap">The bar eases; the number snaps. Numbers must never look approximate.</span></div>
</div></div>
<p class="note" style="margin-top:20px">Every animation above is gated behind <code>prefers-reduced-motion</code> and the in-app motion switch. With motion off, the territory still changes colour — it simply changes instantly.</p>
</section>`;

SYS.access = ()=>`
<section><h3>Accessibility</h3>
<p class="lead">Two constraints shape this product more than any style choice: it is used in daylight, and it is used while moving.</p>
<div class="demo"><div class="demo-grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">
  <div class="stack" style="gap:8px"><span class="t-label">Contrast</span>
    <div class="t-small">Measured against the surface they sit on: body copy 7.6:1, captions 5.5:1, primary buttons 15.7:1. The lime primary always carries near-black text, never white.</div>
    <div class="row gap2"><span class="btn btn-primary btn-sm">15.7:1</span><span class="btn btn-secondary btn-sm">14.1:1</span></div></div>
  <div class="stack" style="gap:8px"><span class="t-label">Touch targets</span>
    <div class="t-small">Minimum 44×44. During an activity the pause and finish controls grow to 58px because they are pressed with a thumb, mid-stride.</div></div>
  <div class="stack" style="gap:8px"><span class="t-label">Never colour alone</span>
    <div class="t-small">Ownership carries a hue, a label, a border style and a fill pattern. Turn on the colour-blind switch at the top of this page to see the patterns appear on every map.</div></div>
  <div class="stack" style="gap:8px"><span class="t-label">Screen readers</span>
    <div class="t-small">Every map is an <code>img</code> with a written summary; controls carry explicit labels ("Centre on my location") rather than icon names.</div></div>
  <div class="stack" style="gap:8px"><span class="t-label">Keyboard</span>
    <div class="t-small">The desktop app is fully tabbable, with a visible lime focus ring and a skip link into the map panel.</div></div>
  <div class="stack" style="gap:8px"><span class="t-label">Reduced motion</span>
    <div class="t-small">Honoured at the system level and as an in-app setting. Nothing that conveys information is animation-only.</div></div>
</div></div>
<h3 style="margin-top:34px">Outdoor safety</h3>
<p class="lead">The recording screen is deliberately the least interactive screen in the product.</p>
<div class="demo"><ul class="stack gap3" style="margin:0;padding-left:18px;color:var(--text-2);font-size:14px;line-height:1.6">
  <li>Three metrics, nothing else. Everything secondary waits until the activity ends.</li>
  <li>Pause and finish are 58px, side by side, reachable one-handed.</li>
  <li>No notifications interrupt a recording — they queue and appear on the summary.</li>
  <li>Capture progress updates silently; there is no reason to look at the phone to keep capturing.</li>
  <li>Territory animations are suppressed while recording and replayed on the results screen.</li>
</ul></div></section>`;

SYS.naming = ()=>`
<section><h3>Component naming</h3>
<p class="lead">One name per concept, used in the design file, the tokens and the code. If a component needs a qualifier to be understood, it is probably two components.</p>
<table class="tbl"><thead><tr><th>Component</th><th>Variants</th><th>Where it appears</th></tr></thead><tbody>
${[["Button","primary · secondary · ghost · danger · sm/lg","Everywhere; one primary per screen"],
["IconButton","square · round · map control","Headers, map overlays"],
["StatCard","with delta · without","Home, profile, sheets, dashboard"],
["ActivityCard","run · walk · ride","Home, profile, activity list"],
["TerritoryCard","own · rival · neutral","My territories, search results"],
["PlayerCard","compact · full","Nearby, player search"],
["LeaderboardRow","default · me","Leaderboard, dashboard"],
["MapControl","zoom · compass · locate · layers","Live map, desktop map"],
["MapLegend","collapsed · expanded","Live map, desktop map"],
["BottomSheet","territory · player · confirm","Map interactions"],
["CaptureProgress","locked · available · in progress · nearly · captured · failed","Recording screen, sheets"],
["ActivityMetric","distance · time · pace · area","Recording HUD, summary"],
["NotificationItem","attack · capture · growth · achievement · defence","Notifications"],
["AchievementCard","locked · unlocked · in progress","Achievements"],
["Avatar","sm · default · lg · ring","Everywhere"],
["StatusIndicator","live · recording · paused · capturing · under attack · captured · protected · offline · syncing","Everywhere"]].map(r=>
`<tr><td><code>${r[0]}</code></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table>
<h3 style="margin-top:34px">The loop this interface has to teach</h3>
<div class="demo"><div class="row gap3" style="flex-wrap:wrap;align-items:center">
${["Move","Create","Expand","Discover","Compete","Capture","Own more"].map((s,i,a)=>
`<span class="chip" style="height:34px;padding:0 14px;font-size:13px;${i===a.length-1?"background:var(--primary-wash);color:var(--primary)":""}">${s}</span>${i<a.length-1?`<span style="color:var(--text-3)">${ic("arrowR",15)}</span>`:""}`).join("")}
</div><p class="t-small" style="margin:16px 0 0;max-width:62ch">A first-time player should read this loop off the map alone: their own colour, someone else's colour, and a dotted line showing where the two meet.</p></div>
</section>`;

/* ============================================================
   ROUTER + INTERACTION
   ============================================================ */
const FLOW=[
 ["Launch",[["splash","Splash"],["onboarding","Onboarding"],["login","Sign in"],["register","Create account"]]],
 ["Play",[["home","Home"],["map","Live map"],["activity-select","Start activity"],["pre-activity","Get ready"],
   ["active","Recording & capture"],["capture-done","Territory captured"],["result","Activity summary"]]],
 ["Territory",[["territories","My territories"],["history","Territory history"]]],
 ["Social",[["leaderboard","Leaderboard"],["profile","Your profile"],["player","Player profile"],
   ["notifications","Notifications"],["achievements","Achievements"]]],
 ["System",[["settings","Settings"],["privacy","Privacy"],["states-empty","Empty & loading"],["states-error","Errors & offline"]]]
];
const ORDER=FLOW.flatMap(g=>g[1].map(s=>s[0]));
const NOTES={
 splash:["Splash","A route line closes into a polygon — the whole game in one gesture. Tap anywhere to continue."],
 onboarding:["Onboarding","Four screens, each showing the real map rather than an illustration of one."],
 login:["Sign in","Deliberately plain. Authentication is not where a territory game earns attention."],
 register:["Create account","Username is collected here because it is what rivals see printed on the map."],
 home:["Home","Territory is the headline metric; starting an activity is one tap from the top of the screen."],
 map:["Live map","The identity screen. Switch between the five map states with the pills at the top, and tap the card to open the territory sheet."],
 "activity-select":["Start activity","Three large targets. Selection is a whole card, not a radio dot."],
 "pre-activity":["Get ready","GPS status is shown but never blocks the start button."],
 active:["Recording & capture","Press play to run the simulated route. The territory preview grows behind you, and the capture panel appears when you cross into Midtown Runners."],
 "capture-done":["Territory captured","The reward screen. Colour change first, numbers second, confetti never."],
 result:["Activity summary","Before and after maps make the territory change legible without reading a number."],
 territories:["My territories","Tabs include an empty state worth designing — try 'Protected'."],
 history:["Territory history","A plain timeline. Territory gain is the only thing emphasised."],
 leaderboard:["Leaderboard","Three filter dimensions kept visually quiet so the rows stay scannable."],
 profile:["Your profile","Your map, your numbers, your progression — in that order."],
 player:["Player profile","The same layout with privacy limits applied and social actions added."],
 notifications:["Notifications","Five notification types, each with its own icon treatment and destination."],
 achievements:["Achievements","Locked states show progress, so a locked badge is still useful."],
 settings:["Settings","Deliberately short. Privacy gets its own screen."],
 privacy:["Privacy","Each option explains what other players would actually see."],
 "states-empty":["Empty & loading","Empty screens are invitations. Skeletons match the shape of the content they replace."],
 "states-error":["Errors & offline","Errors say what happened and what to do. None of them mention a server."]
};
const DNOTES={dashboard:["Dashboard","Map plus analytics — the desktop's reason to exist."],
 map:["Live map","Floating panels instead of a bottom sheet; the map never gets covered."],
 territories:["Territories","Management and history side by side."],
 activities:["Activities","A dense table, because desktop is where people audit their history."],
 leaderboard:["Leaderboard","Adds a city-wide ownership split the phone has no room for."],
 players:["Player profile","Privacy rules carry across surfaces unchanged."],
 profile:["Player profile","Privacy rules carry across surfaces unchanged."],
 settings:["Settings","Privacy options become cards with room to explain themselves."]};

const $=s=>document.querySelector(s);
const side=$("#side"), stage=$("#stage"), work=$("#work");

function renderSide(){
  if(S.surface==="mobile"){
    side.innerHTML=FLOW.map(([g,items])=>`<div class="nav-h">${g}</div><ul class="navlist">${items.map(([id,l])=>
      `<li><button data-nav="${id}" ${S.screen===id?'aria-current="true"':""}><span class="dot"></span>${l}</button></li>`).join("")}</ul>`).join("");
  } else if(S.surface==="desktop"){
    side.innerHTML=`<div class="nav-h">Desktop views</div><ul class="navlist">${DNAV.filter((d,i)=>i!==6).map(([k,l])=>
      `<li><button data-dnav="${k}" ${S.desk===k?'aria-current="true"':""}><span class="dot"></span>${l}</button></li>`).join("")}</ul>`;
  } else {
    side.innerHTML=`<div class="nav-h">Design system</div><ul class="navlist">${SYSNAV.map(([k,l])=>
      `<li><button data-snav="${k}" ${S.sys===k?'aria-current="true"':""}><span class="dot"></span>${l}</button></li>`).join("")}</ul>`;
  }
}
function renderStage(){
  work.classList.toggle("wide",false);
  if(S.surface==="mobile"){
    const i=ORDER.indexOf(S.screen), n=NOTES[S.screen]||[S.screen,""];
    stage.innerHTML=`<div class="stage-head">
      <div><h2>${n[0]}</h2><p>${n[1]}</p></div>
      <div class="spacer"></div>
      <div class="stepper">
        <button data-step="-1" aria-label="Previous screen">${ic("chevL",17)}</button>
        <span>${i+1} / ${ORDER.length}</span>
        <button data-step="1" aria-label="Next screen">${ic("chevR",17)}</button></div>
    </div>
    <div class="devwrap"><div class="device" id="dev">${(M[S.screen]||M.home)()}</div></div>`;
    fitDevice();
    if(S.screen==="active") wireRun();
  } else if(S.surface==="desktop"){
    const n=DNOTES[S.desk]||[S.desk,""];
    stage.innerHTML=`<div class="stage-head"><div><h2>${n[0]}</h2><p>${n[1]} · 1440 × 900</p></div></div>
      <div style="width:100%;overflow:hidden" id="deskwrap">${(D[S.desk]||D.dashboard)()}</div>`;
    fitBrowser();
  } else {
    stage.innerHTML=`<div class="stage-head"><div><h2>${SYSNAV.find(s=>s[0]===S.sys)[1]}</h2>
      <p>Tokens and components are defined once and reused across mobile, tablet and desktop.</p></div></div>
      <div class="ds">${SYS[S.sys]()}</div>`;
  }
}
function render(){renderSide();renderStage()}
function go(id){
  if(id===S.screen && id!=="active") return;
  stopRun(); S.sheet=null;
  S.screen=id; render(); }
function fitDevice(){
  const dev=$("#dev"); if(!dev) return;
  const availW=stage.clientWidth, availH=window.innerHeight-190;
  const narrow=window.innerWidth<760;
  const sc=narrow?Math.min(1,(availW-8)/390):Math.min(1,(availW-8)/390,Math.max(.5,availH/844));
  dev.style.transform=`scale(${sc})`;
  dev.parentElement.style.height=(844*sc+16)+"px";
}
function fitBrowser(){
  const w=$("#deskwrap"); if(!w) return;
  const br=w.querySelector(".browser"); if(!br) return;
  const sc=Math.min(1,w.clientWidth/1440);
  br.style.transform=`scale(${sc})`; w.style.height=(900*sc+8)+"px";
}
window.addEventListener("resize",()=>{fitDevice();fitBrowser()});

/* ---------- run simulation ---------- */
let runRefs=null, lastCap=false;
function wireRun(){
  const d=$("#dev"); if(!d) return;
  runRefs={route:d.querySelector(".route"),prev:d.querySelector(".route-prev"),me:d.querySelector(".me-marker"),
    km:d.querySelector("#m-km"),time:d.querySelector("#m-time"),pace:d.querySelector("#m-pace"),
    capBar:d.querySelector("#cap-bar"),capPct:d.querySelector("#cap-pct"),capKm:d.querySelector("#cap-km"),
    prevArea:d.querySelector("#prev-area")};
  lastCap=capProgress(S.run.t)>0;
  if(S.run.playing) tickStart();
}
function paintRun(){
  if(!runRefs) return;
  const t=S.run.t, pts=routeUpTo(t), d=runData(t), cp=capProgress(t);
  if(runRefs.route) runRefs.route.setAttribute("d","M"+ptsAttr(pts).replace(/ /g," L"));
  if(runRefs.prev&&pts.length>3) runRefs.prev.setAttribute("points",ptsAttr(pts));
  const p=pts[pts.length-1];
  if(runRefs.me) runRefs.me.setAttribute("transform",`translate(${p[0].toFixed(1)},${p[1].toFixed(1)})`);
  if(runRefs.km) runRefs.km.textContent=d.km;
  if(runRefs.time) runRefs.time.textContent=d.time;
  if(runRefs.pace) runRefs.pace.textContent=d.pace;
  if(runRefs.prevArea) runRefs.prevArea.textContent=d.area;
  if(runRefs.capBar){runRefs.capBar.style.width=(cp*100).toFixed(1)+"%";
    runRefs.capPct.textContent=Math.round(cp*100)+"%";
    runRefs.capKm.textContent=(8.42*cp).toFixed(1)+" / 8.42 km² contested";}
  if((cp>0)!==lastCap || (cp>=1&&!S.run.done)){ if(cp>=1) S.run.done=true; lastCap=cp>0; renderStage(); }
}
function tickStart(){
  if(S.run.raf) cancelAnimationFrame(S.run.raf);
  let last=performance.now();
  const step=now=>{
    if(!S.run.playing){S.run.raf=null;return}
    const dt=(now-last)/1000; last=now;
    S.run.t=Math.min(1,S.run.t+dt/26);
    if(S.run.t>=1){S.run.playing=false;S.run.raf=null;paintRun();renderStage();return}
    /* schedule before painting: paintRun may re-render and restart the loop */
    S.run.raf=requestAnimationFrame(step);
    paintRun();
  };
  S.run.raf=requestAnimationFrame(step);
}
function stopRun(){if(S.run.raf){cancelAnimationFrame(S.run.raf);S.run.raf=null}S.run.playing=false}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-nav]"); if(nav){go(nav.dataset.nav);return}
  const dn=e.target.closest("[data-dnav]"); if(dn){S.desk=dn.dataset.dnav;render();return}
  const sn=e.target.closest("[data-snav]"); if(sn){S.sys=sn.dataset.snav;render();window.scrollTo({top:0,behavior:"smooth"});return}
  const st=e.target.closest("[data-step]");
  if(st){const i=ORDER.indexOf(S.screen)+ +st.dataset.step;go(ORDER[(i+ORDER.length)%ORDER.length]);return}
  const surf=e.target.closest("[data-surface]");
  if(surf){S.surface=surf.dataset.surface;stopRun();
    document.querySelectorAll("[data-surface]").forEach(b=>b.setAttribute("aria-selected",b===surf));render();return}

  const act=e.target.closest("[data-act]");
  if(act){
    const [k,a,b]=act.dataset.act.split(":");
    switch(k){
      case "onb-next": if(S.onb<ONB.length-1){S.onb++;renderStage()}else{S.onb=0;go("login")} return;
      case "onb-prev": S.onb=Math.max(0,S.onb-1);renderStage();return;
      case "auth-submit": S.busy=true;renderStage();setTimeout(()=>{S.busy=false;go("home")},700);return;
      case "mapmode": S.mapMode=a;S.sheet=null;renderStage();return;
      case "mapmode-go": S.mapMode=a;go("map");return;
      case "map-attack": S.mapMode="own";go("map");return;
      case "sheet": S.sheet=(a==="close"?null:a);renderStage();return;
      case "sheet-go": S.mapMode="own";S.screen="map";S.sheet=a;render();return;
      case "pick": S.actType=a;renderStage();return;
      case "terrtab": S.terrTab=a;renderStage();return;
      case "lb": if(a==="scope")S.lbScope=b; if(a==="cat")S.lbCat=b; if(a==="time")S.lbTime=b; renderStage();return;
      case "legend": S.legend=!S.legend;renderStage();return;
      case "run-start": S.run={t:0,playing:true,elapsed:0,raf:null,done:false};go("active");return;
      case "run-toggle": S.run.playing=!S.run.playing; renderStage(); return;
      case "run-finish": stopRun(); go(capProgress(S.run.t)>=1?"capture-done":"result"); return;
      case "priv": PRIVACY[+a].v=b; renderStage(); return;
      case "desk": S.desk=a; render(); return;
      case "sw": {const on=act.getAttribute("aria-checked")==="true";act.setAttribute("aria-checked",!on);return}
      case "demo-capture": {
        const box=$("#capdemo"); if(!box) return;
        box.innerHTML=mapSVG({view:fitView(T("midtown").pts),terr:["midtown"],recolor:{midtown:"you"},hot:"midtown",labels:false,me:false,players:false});
        box.firstElementChild.style.animation="growIn var(--d-major) var(--ease-out) both";
        setTimeout(()=>{box.innerHTML=mapSVG({view:fitView(T("midtown").pts),terr:["midtown"],labels:false,me:false,players:false})},2200);
        return}
      case "demo-bar": {const b2=$("#demobar");if(b2)b2.style.width=Math.min(100,parseFloat(b2.style.width||"12")+22)+"%";return}
    }
  }
  const g=e.target.closest("[data-go]");
  if(g && g.dataset.go && S.surface==="mobile") go(g.dataset.go);
});

$("#tg-motion").addEventListener("click",function(){
  const on=this.getAttribute("aria-pressed")==="true";
  this.setAttribute("aria-pressed",!on); document.body.dataset.motion=!on?"on":"off";
});
$("#tg-cvd").addEventListener("click",function(){
  const on=this.getAttribute("aria-pressed")==="true";
  this.setAttribute("aria-pressed",!on); document.body.dataset.cvd=!on?"true":"false";
});
document.addEventListener("keydown",e=>{
  if(S.surface!=="mobile"||e.target.matches("input,textarea")) return;
  if(e.key==="ArrowRight"){const i=ORDER.indexOf(S.screen)+1;go(ORDER[i%ORDER.length])}
  if(e.key==="ArrowLeft"){const i=ORDER.indexOf(S.screen)-1;go(ORDER[(i+ORDER.length)%ORDER.length])}
});

render();
</script>
</body>
</html>
